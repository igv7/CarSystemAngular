<div class="dashboard">
    <app-side-menu class="sidebar" homeLabel="Overview" homeLink="/admin" [sections]="sections"
                   storageKey="adminMenuCollapsed" (signOut)="logout()"></app-side-menu>
    <div class="content">
        <router-outlet (activate)="hasChild = true" (deactivate)="hasChild = false"></router-outlet>
        <div class="overview" *ngIf="!hasChild">
            <h2>Admin Page</h2>
            <p>Choose an operation from the menu: clients, cars, client cars or receipts.</p>
        </div>
    </div>
</div>
