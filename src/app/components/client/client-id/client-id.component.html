<app-page-message [text]="message"></app-page-message>

<div *ngIf="!message">
    <h3>ID: {{client.id}}</h3>
    <h3>Name: {{client.name}}</h3>
    <h3>Identity Number: {{client.clientID}}</h3>
    <h3>DOB: {{client.birthday}}</h3>
    <h3>Phone number: {{client.phoneNumber}}</h3>
    <h3>Email: {{client.email}}</h3>
    <h3>Balanse: {{client.balance}}</h3>
</div>
