<div class="dashboard">
    <app-side-menu class="sidebar" homeLabel="Overview" [homeLink]="homeLink" [sections]="sections"
                   [storageKey]="menuStorageKey" (signOut)="logout()"></app-side-menu>
    <div class="content">
        <router-outlet (activate)="hasChild = true" (deactivate)="hasChild = false"></router-outlet>
        <div class="overview" *ngIf="!hasChild">
            <h2>Hi{{ userName ? ', ' + userName : '' }}!</h2>
            <p>This is the Client Page. Choose from the menu: rent a car, or see your cars, receipts or balance.</p>
        </div>
    </div>
</div>
