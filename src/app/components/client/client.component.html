<div class="dashboard">
    <app-side-menu class="sidebar" homeLabel="Overview" homeLink="/client" [sections]="sections"
                   storageKey="clientMenuCollapsed" (signOut)="logout()"></app-side-menu>
    <div class="content">
        <router-outlet (activate)="hasChild = true" (deactivate)="hasChild = false"></router-outlet>
        <div class="overview" *ngIf="!hasChild">
            <h2>Client Page</h2>
            <p>Choose from the menu: rent a car, or see your cars, receipts or balance.</p>
        </div>
    </div>
</div>
